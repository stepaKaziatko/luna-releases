name: Verify release

# Проверяет выложенный релиз так, как его получит пользователь: ставит скриптом
# установки и запускает. Сами сборки приходят из закрытого репозитория.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза; пусто — последний
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    name: Установка и запуск (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Установить скриптом
        run: LUNA_VERSION="$TAG" LUNA_INSTALL_DIR="$RUNNER_TEMP/Applications" sh install.sh
      - name: Приложение запускается и поднимает ядро
        run: |
          app="$RUNNER_TEMP/Applications/Luna.app"
          codesign --verify --strict "$app"
          lipo "$app/Contents/MacOS/Luna" -verify_arch arm64 x86_64
          LUNA_DATA_DIR="$RUNNER_TEMP/luna-data" "$app/Contents/MacOS/Luna" > "$RUNNER_TEMP/luna.log" 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null || ! pgrep -P "$pid" -f 'core/main.js' >/dev/null; then
            cat "$RUNNER_TEMP/luna.log"
            exit 1
          fi
          kill "$pid"

  linux:
    name: Ядро (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Скачать и сверить
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern 'luna-core-*-linux.tar.gz' --pattern checksums.txt
          sha256sum -c checksums.txt --ignore-missing
          mkdir core && tar -xzf luna-core-*-linux.tar.gz -C core --strip-components 1
      - name: Ядро отвечает на core.hello
        run: |
          # Ядро завершается, как только закрыт stdin, поэтому держим его открытым до ответа.
          reply=$( (printf '{"jsonrpc":"2.0","id":1,"method":"core.hello","params":{}}\n'; sleep 3) \
            | LUNA_DATA_DIR="$RUNNER_TEMP/luna-data" node core/main.js )
          echo "$reply"
          echo "$reply" | grep -q '"version"'
