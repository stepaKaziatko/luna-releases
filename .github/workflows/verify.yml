name: Verify release

# Проверяет выложенный релиз так, как его получит пользователь: ставит скриптом
# установки и запускает. Сами сборки приходят из закрытого репозитория.
#
# Состав релиза — один архив Luna-<версия>-macos-universal.zip и checksums.txt:
# отдельного ядра и сборок под другие системы у Luna больше нет.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза; пусто — последний
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    name: Установка и запуск (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Минимальная macOS приложения и самая новая из доступных раннеров.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      - name: Установить скриптом
        run: LUNA_VERSION="$TAG" LUNA_INSTALL_DIR="$RUNNER_TEMP/Applications" sh install.sh
      - name: Подпись и обе архитектуры
        run: |
          app="$RUNNER_TEMP/Applications/Luna.app"
          codesign --verify --strict "$app"
          lipo "$app/Contents/MacOS/Luna" -verify_arch arm64 x86_64
      - name: Приложение запускается и завершается
        # Чистый HOME, SIGTERM и SIGKILL, 5 с на выход — правила scripts/smoke.sh.
        run: sh scripts/smoke.sh "$RUNNER_TEMP/Applications/Luna.app"
      # Последним: расхождение минимума не должно прятать результат запуска.
      - name: Минимум macOS в бандле совпадает с install.sh
        run: |
          app="$RUNNER_TEMP/Applications/Luna.app"
          want=$(sed -n 's/^min_macos=//p' install.sh)
          have=$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")
          echo "install.sh: macOS $want; LSMinimumSystemVersion бандла: $have"
          if [ -z "$want" ] || [ "${have%%.*}" != "$want" ]; then
            echo "✗ минимум macOS в бандле ($have) не совпал с min_macos в install.sh ($want): поправьте install.sh и README.md" >&2
            exit 1
          fi
